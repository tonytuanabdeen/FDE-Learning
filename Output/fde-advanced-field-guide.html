<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE Onboarding — Advanced Mode (Lead Delivery)</title>
<script>/* set theme before paint to avoid flash */try{document.documentElement.dataset.theme=localStorage.getItem('fde-theme')||'auto';}catch(e){document.documentElement.dataset.theme='auto';}</script>
<style>
:root, :root[data-theme="light"]{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#F5F8FC; --ink:#14212E; --muted:#56687A; --line:#DBE3EE;
  --primary:#0B66C2; --primary-2:#1488E6; --primary-ink:#FFFFFF; --accent:#0B66C2;
  --mark:#F2A93B; --mark-soft:#FCEFD6; --ok:#17885A; --warn:#C6392A; --warn-soft:#FBE4E0;
  --code-bg:#0E1D2A; --code-ink:#DCE8F2; --code-head:#16293A; --code-border:rgba(255,255,255,.06);
  --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.82);
  --shadow:0 1px 2px rgba(16,33,43,.06),0 6px 22px rgba(16,33,43,.07);
  --shadow-lg:0 10px 40px rgba(16,33,43,.14);
}
:root[data-theme="dark"]{
  --bg:#0C141C; --surface:#13212D; --surface-2:#0F1B25; --ink:#E7EEF4; --muted:#94A6B6; --line:#243643;
  --primary:#4FA8E8; --primary-2:#6FBCF2; --primary-ink:#06121C; --accent:#4FA8E8;
  --mark:#F2A93B; --mark-soft:#2B2614; --ok:#43C089; --warn:#F08B7E; --warn-soft:#2E1917;
  --code-bg:#06121A; --code-ink:#DCE8F2; --code-head:#0E1F2C; --code-border:rgba(255,255,255,.05);
  --hero-ink:#F2F8FF; --hero-sub:rgba(226,240,255,.78);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.32);
  --shadow-lg:0 14px 46px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#0C141C; --surface:#13212D; --surface-2:#0F1B25; --ink:#E7EEF4; --muted:#94A6B6; --line:#243643;
    --primary:#4FA8E8; --primary-2:#6FBCF2; --primary-ink:#06121C; --accent:#4FA8E8;
    --mark:#F2A93B; --mark-soft:#2B2614; --ok:#43C089; --warn:#F08B7E; --warn-soft:#2E1917;
    --code-bg:#06121A; --code-ink:#DCE8F2; --code-head:#0E1F2C; --code-border:rgba(255,255,255,.05);
    --hero-ink:#F2F8FF; --hero-sub:rgba(226,240,255,.78);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.32);
    --shadow-lg:0 14px 46px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:5px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--primary)}

.top{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:1220px;margin:0 auto;padding:11px 22px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:11px}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font:800 14px/1 ui-monospace,monospace;box-shadow:var(--shadow)}
.brand .tt{min-width:0}
.brand h1{margin:0;font:800 16.5px/1.15 inherit;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}
.ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.seg button{padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.search{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 13px;font-size:14px;width:190px;max-width:42vw}
.iconbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600;color:var(--ink)}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:0;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
.btn-primary svg{width:15px;height:15px}

.progwrap{max-width:1220px;margin:0 auto;padding:0 22px 11px;display:flex;align-items:center;gap:12px}
.progwrap .bar{flex:1;height:7px;border-radius:5px;background:var(--line);overflow:hidden}
.progwrap .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--mark));transition:width .4s cubic-bezier(.4,0,.2,1)}
.progwrap .pct{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.wrap{max-width:1220px;margin:0 auto;padding:26px 22px 90px;display:grid;grid-template-columns:252px 1fr;gap:34px}
nav.toc{position:sticky;top:138px;align-self:start;display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 158px);overflow:auto}
.toc .lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:2px 13px 7px}
.toc button{text-align:left;border-left:3px solid var(--line);padding:9px 13px;border-radius:0 9px 9px 0;display:flex;flex-direction:column;gap:6px}
.toc button:hover{background:var(--surface)}
.toc button[aria-current="true"]{background:var(--surface);border-left-color:var(--mark);box-shadow:var(--shadow)}
.toc .nm{font-weight:700;font-size:14px;display:flex;gap:9px;align-items:center}
.toc .nm i{flex:none;display:inline-grid;place-items:center;width:21px;height:21px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font:700 11px/1 ui-monospace,monospace}
.toc button[aria-current="true"] .nm i,.toc button.complete .nm i{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.toc button.complete .nm i{background:var(--ok);border-color:var(--ok)}
.toc .mini{height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.toc .mini b{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}

main{min-width:0}
.hero{position:relative;border-radius:20px;overflow:hidden;padding:40px 38px;margin:0 0 34px;color:var(--hero-ink);background:
  radial-gradient(900px 400px at 88% -10%,rgba(111,188,242,.42),transparent 60%),
  radial-gradient(700px 360px at -5% 115%,rgba(242,169,59,.30),transparent 55%),
  linear-gradient(140deg,#0A2A4A,#0B66C2 55%,#1488E6);box-shadow:var(--shadow-lg)}
.hero .kicker{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-sub);margin:0 0 10px}
.hero h2{margin:0;font:800 34px/1.08 inherit;letter-spacing:-.025em;max-width:20ch}
.hero p.tag{margin:12px 0 0;font-size:16px;color:var(--hero-sub);max-width:62ch}
.hero .cta{margin:24px 0 0;display:flex;gap:11px;flex-wrap:wrap}
.hero .cta .btn-primary{background:#fff;color:#0B3A66}
.hero .cta .ghost{border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.hero .cta .ghost svg{width:15px;height:15px}
.hero .needs{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.hero .needs span{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;padding:5px 11px;border-radius:20px}

.agenda{margin:0 0 36px}
.agenda .ah{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.steps-row{display:flex;gap:10px;flex-wrap:wrap}
.step-chip{flex:1 1 150px;min-width:140px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;transition:transform .15s,border-color .15s}
.step-chip:hover{transform:translateY(-2px);border-color:var(--primary)}
.step-chip .dot{flex:none;width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font:800 13px/1 ui-monospace,monospace;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.step-chip.complete .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step-chip .sx{min-width:0}
.step-chip .sx b{display:block;font-size:13.5px;line-height:1.25}
.step-chip .sx small{color:var(--muted);font-size:12px}

.sec{margin:0 0 44px;scroll-margin-top:154px}
.sec-h{display:flex;align-items:center;gap:13px}
.sec-h .n{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;font:800 17px/1 ui-monospace,monospace;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:var(--shadow)}
.sec-h h3{font:800 24px/1.15 inherit;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-weight:600;font-size:13.5px;margin:3px 0 0}
.sec-intro{color:var(--muted);margin:12px 0 18px;max-width:74ch;font-size:15.5px}

.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.item summary{list-style:none;display:flex;gap:13px;align-items:center;padding:15px 17px;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.chk-box{appearance:none;-webkit-appearance:none;width:23px;height:23px;flex:none;border:2px solid var(--line);border-radius:7px;cursor:pointer;position:relative;background:var(--bg);transition:background .15s,border-color .15s}
.chk-box:checked{background:var(--ok);border-color:var(--ok)}
.chk-box:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.item .t{font-weight:700;flex:1;font-size:16px}
.item.done .t{color:var(--muted)}
.item.done .t::after{content:" ✓ done";color:var(--ok);font-size:12px;font-weight:700}
.exp{flex:none;color:var(--muted);font:400 25px/1 ui-monospace,monospace;width:22px;text-align:center}
.item[open] .exp::after{content:"\2212"}.item:not([open]) .exp::after{content:"+"}
.body{padding:2px 19px 19px 53px}
.body>p{margin:0 0 12px;max-width:74ch}

ol.steps,ul.pts,ul.chk{max-width:74ch}
ol.steps{margin:0 0 12px;padding-left:22px}ol.steps>li{margin:7px 0}
ol.steps ul{margin:6px 0 0;padding-left:18px;list-style:disc;color:var(--muted)}
ul.pts{margin:0 0 12px;padding-left:20px}ul.pts li{margin:5px 0}
ul.chk{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
ul.chk li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
ul.chk li::before{content:"✓";flex:none;width:20px;height:20px;margin-top:1px;border-radius:6px;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.subhead{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 0 9px}

.note{border-left:4px solid var(--mark);background:var(--mark-soft);padding:10px 14px;margin:0 0 12px;border-radius:0 9px 9px 0;font-size:14.5px;max-width:74ch}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.note{border-left-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.note b{font-weight:700}

.code{margin:0 0 12px;border-radius:11px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-border)}
.ch{display:flex;justify-content:space-between;align-items:center;background:var(--code-head);color:var(--code-ink);padding:7px 10px 7px 14px;font-size:12.5px;font-weight:700}
.ch .os{opacity:.65;font-weight:500}
.copy{border:1px solid #3a5468;color:var(--code-ink);border-radius:7px;padding:3px 12px;font-size:12.5px;font-weight:600}
.copy:hover{background:#21415a}
pre{margin:0;padding:14px;overflow-x:auto;color:var(--code-ink);font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre .cmt{color:#7fa6c4}

.empty{padding:36px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.results-head{color:var(--muted);margin:0 0 14px}
.reset{color:var(--primary);text-decoration:underline;padding:0}
.tag2{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin-left:9px;white-space:nowrap;vertical-align:middle;font-weight:600}

.deck{position:fixed;inset:0;z-index:60;background:
  radial-gradient(1100px 520px at 85% -8%,color-mix(in srgb,var(--primary) 20%,transparent),transparent 60%),
  radial-gradient(900px 480px at -5% 110%,color-mix(in srgb,var(--mark) 16%,transparent),transparent 55%),
  var(--bg);display:flex;flex-direction:column}
.deck[hidden]{display:none}
.deck-top{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line)}
.deck-top .dt-brand{display:flex;align-items:center;gap:10px;font-weight:800;flex:1;min-width:0}
.deck-top .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.deck-stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:34px 26px}
.slide{width:100%;max-width:920px;margin:auto 0;animation:slidein .32s cubic-bezier(.2,.7,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide .s-num{font:800 13px/1 ui-monospace,monospace;letter-spacing:.1em;color:var(--primary);text-transform:uppercase;margin:0 0 10px}
.slide h2{font:800 40px/1.06 inherit;letter-spacing:-.03em;margin:0}
.slide .s-sub{color:var(--muted);font-weight:600;font-size:16px;margin:8px 0 0}
.slide .s-intro{font-size:18px;line-height:1.5;margin:18px 0 22px;max-width:70ch;color:var(--ink)}
.slide .item{box-shadow:var(--shadow)}
.slide .item>.body{padding-top:14px}
.deck-cover{text-align:left}
.deck-cover h2{font-size:46px;max-width:18ch}
.deck-cover .lead{font-size:19px;color:var(--muted);max-width:60ch;margin:16px 0 0}
.deck-cover .bigsteps{margin:26px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.deck-cover .bigsteps div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;gap:11px;align-items:center;box-shadow:var(--shadow)}
.deck-cover .bigsteps b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--primary);color:var(--primary-ink);font:800 13px/1 ui-monospace,monospace;flex:none}
.deck-cover .hint{margin:26px 0 0;color:var(--muted);font-size:13.5px}
.deck-done{text-align:center}
.deck-done .big{font-size:64px;line-height:1;margin:0 0 6px}
.deck-done h2{font-size:40px}.deck-done .lead{color:var(--muted);font-size:18px;max-width:52ch;margin:14px auto 0}
.deck-done .code{text-align:left;max-width:640px;margin:24px auto 0}
.deck-bottom{display:flex;align-items:center;gap:16px;padding:16px 26px;border-top:1px solid var(--line)}
.dots{flex:1;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button[aria-current="true"]{background:var(--primary);width:26px;border-radius:6px}
.navb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:700;font-size:13.5px}
.navb:disabled{opacity:.4;cursor:default}
.navb.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:0}
.navb svg{width:15px;height:15px}

@media (max-width:880px){
  .wrap{grid-template-columns:1fr;gap:16px}
  nav.toc{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}
  .toc .lbl{display:none}
  .toc button{min-width:190px;border-left-width:1px;border-top:3px solid var(--line);border-radius:0 0 10px 10px}
  .toc button[aria-current="true"]{border-top-color:var(--mark)}
  .hero{padding:30px 24px}.hero h2{font-size:27px}
  .body{padding-left:19px}
  .deck-cover .bigsteps{grid-template-columns:1fr}
  .slide h2{font-size:30px}.deck-cover h2{font-size:32px}
  .search{width:140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="logo">FDE</span>
      <div class="tt">
        <h1>Onboarding Playbook</h1>
        <p>Advanced Mode · Lead Delivery</p>
      </div>
    </div>
    <div class="ctrl">
      <div class="seg" role="group" aria-label="Operating system">
        <button type="button" data-os="mac" aria-pressed="true">macOS / Linux</button>
        <button type="button" data-os="win" aria-pressed="false">Windows</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search" aria-label="Search the guide">
      <button type="button" class="iconbtn" id="theme" aria-label="Change colour theme"></button>
      <button type="button" class="btn-primary" id="present-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Present
      </button>
    </div>
  </div>
  <div class="progwrap">
    <span class="pct" id="pctlabel">0% complete</span>
    <span class="bar"><b id="overallbar"></b></span>
    <span class="pct" id="countlabel">0 of 0</span>
  </div>
</header>

<div class="wrap">
  <nav class="toc" id="toc" aria-label="Sections"></nav>
  <main id="main" aria-live="polite"></main>
</div>

<div class="deck" id="deck" hidden role="dialog" aria-modal="true" aria-label="Onboarding presentation">
  <div class="deck-top">
    <div class="dt-brand"><span class="logo">FDE</span> Onboarding · Advanced Mode</div>
    <div class="seg" role="group" aria-label="Operating system">
      <button type="button" data-os="mac" aria-pressed="true">macOS / Linux</button>
      <button type="button" data-os="win" aria-pressed="false">Windows</button>
    </div>
    <button type="button" class="iconbtn" id="theme2" aria-label="Change colour theme"></button>
    <span class="count" id="deck-count"></span>
    <button type="button" class="iconbtn" id="deck-exit" aria-label="Exit presentation (Esc)">✕ Exit</button>
  </div>
  <div class="deck-stage"><div class="slide" id="slide"></div></div>
  <div class="deck-bottom">
    <button type="button" class="navb" id="prev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Back
    </button>
    <div class="dots" id="dots"></div>
    <button type="button" class="navb primary" id="next">
      Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script>
/* ================= CONTENT — from FDE-Playbook-Advanced.md =================
   Placeholders: YOUR-ORG (GitHub org), acme-fde (project), client-dev / client-uat /
   client-prod (org aliases), CUSTOMER_1 (data). CLI patterns are illustrative — confirm
   flags for your sf version and approved pipeline. Never put real customer data,
   credentials, or auth URLs anywhere. */
const SECTIONS = [
{
  id:'harness', n:'1', title:'The agent harness', sub:'The system around the model', icon:'Overview',
  intro:'The harness is everything around the model that turns a language model into a dependable product feature. As an FDE lead you own the seams between these pieces, not just the pieces themselves.',
  items:[
    { id:'h-model', t:'Understand what the harness is',
      d:'For Agentforce, the harness spans the channel, the agent (topics and routing), actions, grounding, reasoning, and guardrails — all the way to systems of record.',
      code:[{l:'The Agentforce harness', x:'User / channel  ->  Agent (Topics)  ->  Actions            ->  Systems of record\n(web, Slack,         |  routing &         (Flows, Apex,           (Salesforce objects,\n mobile, voice)      |  instructions)     Prompt Templates,        external APIs via\n                     |                    Agent Script, MCP)       Named Credentials)\n                     v\n              Grounding & context          Reasoning (LLM)          Guardrails\n              (retrieval, knowledge,       plan -> act -> observe    (scope limits,\n               session variables)          over multiple turns        refusal, validation)'}],

{

{
  id:'quality', n:'3', title:'Testing, evaluation & quality', sub:'Prove it works', icon:'Quality',

  $('#deck-count').textContent=(slideIx+1)+' / '+SLIDES.length;
  $('#prev').disabled=slideIx===0; $('#next').disabled=slideIx===SLIDES.length-1;
  $('#dots').innerHTML=SLIDES.map((_,i)=>'<button type="button" data-slide="'+i+'" aria-current="'+(i===slideIx)+'" aria-label="Slide '+(i+1)+'"></button>').join('');
}
function openDeck(i){ slideIx=i||0; document.body.classList.add('noscroll'); $('#deck').hidden=false; renderSlide(); $('#next').focus(); }
function closeDeck(){ $('#deck').hidden=true; document.body.classList.remove('noscroll'); renderMain(); }
function go(d){ const n=slideIx+d; if(n>=0&&n<SLIDES.length){ slideIx=n; renderSlide(); } }

/* events */
function gotoSection(id){ if(state.q){ state.q=''; $('#q').value=''; render(); } const el=document.getElementById(id); if(el) el.scrollIntoView({block:'start'}); }
document.addEventListener('click', e=>{
  const g=e.target.closest('[data-goto]'); if(g){ gotoSection(g.dataset.goto); return; }
  const cp=e.target.closest('[data-copy]');
  if(cp){ const txt=copies[+cp.dataset.copy]; const ok=()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1400);};
    const fb=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok();}catch(x){cp.textContent='Ctrl+C';}t.remove();};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,fb); else fb(); return; }
  const ds=e.target.closest('[data-slide]'); if(ds){ slideIx=+ds.dataset.slide; renderSlide(); return; }
  if(e.target.id==='clear'){ state.q=''; $('#q').value=''; render(); }
  if(e.target.id==='present-hero'){ openDeck(0); }
});
document.addEventListener('change', e=>{
  const cb=e.target.closest('[data-done]'); if(!cb) return;
  cb.checked?done.add(cb.dataset.done):done.delete(cb.dataset.done);
  const det=cb.closest('.item'); if(det) det.classList.toggle('done',cb.checked);
  save(); renderToc();
});
document.addEventListener('toggle', e=>{ const d=e.target; if(!d.dataset||!d.dataset.id) return; d.open?OPEN.add(d.dataset.id):OPEN.delete(d.dataset.id); }, true);
$$('[data-os]').forEach(b=>b.addEventListener('click', ()=>{ state.os=b.dataset.os; try{localStorage.setItem(OSKEY,state.os);}catch(e){} $$('[data-os]').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.os===state.os))); if($('#deck').hidden) renderMain(); else renderSlide(); }));
$('#q').addEventListener('input', e=>{ state.q=e.target.value; render(); });
$('#theme').addEventListener('click', cycleTheme);
$('#theme2').addEventListener('click', cycleTheme);
$('#present-btn').addEventListener('click', ()=>openDeck(0));
$('#deck-exit').addEventListener('click', closeDeck);
$('#prev').addEventListener('click', ()=>go(-1));
$('#next').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e=>{
  if($('#deck').hidden) return;
  if(e.key==='Escape'){ closeDeck(); } else if(e.key==='ArrowRight'||e.key==='PageDown'){ go(1); } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ go(-1); }
  else if(e.key===' '&&!e.target.closest('input,button,a,details')){ e.preventDefault(); go(1); }
});

/* init */
try{ state.os=localStorage.getItem(OSKEY)||'mac'; }catch(e){}
$$('[data-os]').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.os===state.os)));
paintThemeBtns();
render();
</script>
</body>
</html>
