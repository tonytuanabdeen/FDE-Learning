<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE field guide</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1B252C; --muted:#5B6872; --line:#D5DBD6;
  --primary:#0B5C8C; --primary-ink:#FFFFFF; --mark:#F3C316; --mark-soft:#FBF0C2; --ok:#1E8A5A;
  --code-bg:#14232D; --code-ink:#DCE8EE; --code-head:#1D3140;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10181D; --surface:#17222A; --ink:#E6EDF0; --muted:#93A3AD; --line:#2A3942;
    --primary:#5DB3E6; --primary-ink:#0B1216; --mark:#F3C316; --mark-soft:#2C2A14; --ok:#4CC38A;
    --code-bg:#0B1216; --code-ink:#DCE8EE; --code-head:#16242D;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.brand{flex:1 1 280px}
.brand h1{margin:0;font:700 24px/1.2 var(--serif)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.search{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:14px;width:210px}
.trail{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:6px;background:var(--bg)}
.trail i{display:block;background:var(--line);position:relative}
.trail i b{position:absolute;inset:0 auto 0 0;background:var(--mark);width:0;transition:width .3s}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px;display:grid;grid-template-columns:270px 1fr;gap:34px}
nav.tabs{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:8px}
.tab{text-align:left;background:transparent;border:1px solid transparent;border-left:4px solid var(--line);padding:11px 14px;border-radius:0 6px 6px 0}
.tab:hover{background:var(--surface)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);border-left-color:var(--mark)}
.tab strong{display:block;font:700 17px/1.25 var(--serif)}
.tab span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tab .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.tab .bar b{display:block;height:100%;background:var(--ok);width:0}

main h2{font:700 34px/1.15 var(--serif);margin:0 0 8px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 6px}
.meta{color:var(--muted);font-size:14px;margin:0 0 6px}
main h3{font:700 22px/1.25 var(--serif);margin:36px 0 4px}
.sec-intro{color:var(--muted);margin:0 0 14px;max-width:70ch}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin-left:8px;white-space:nowrap}

/* items on a trail */
.items{border-left:2px solid var(--line);margin-left:9px;padding-left:24px;display:flex;flex-direction:column;gap:10px}
.item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.item::before{content:"";position:absolute;left:-33px;top:19px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.item.done::before{background:var(--mark);border-color:var(--mark)}
.item summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.item summary input{width:20px;height:20px;accent-color:var(--ok);flex:none;cursor:pointer}
.item .t{font-weight:600;flex:1}
.item.done .t{color:var(--muted)}
.item summary::after{content:"+";font:400 22px/1 var(--mono);color:var(--muted);flex:none}
.item[open] summary::after{content:"\2212"}
.body{padding:0 16px 16px 46px}
.body p{margin:0 0 12px;max-width:72ch}
.note{border-left:4px solid var(--mark);background:var(--mark-soft);padding:8px 12px;margin:0 0 12px;border-radius:0 6px 6px 0;font-size:15px;max-width:72ch}
.note.warn{border-left-color:#D2452F}
.note b{font-weight:700}
ul.pts{margin:0 0 12px;padding-left:20px;max-width:72ch}
ul.pts li{margin:3px 0}

.code{margin:0 0 12px;border-radius:6px;overflow:hidden;background:var(--code-bg)}
.ch{display:flex;justify-content:space-between;align-items:center;background:var(--code-head);color:var(--code-ink);padding:5px 8px 5px 12px;font-size:13px}
.copy{background:transparent;border:1px solid #4a6376;color:var(--code-ink);border-radius:4px;padding:2px 10px;font-size:13px}
.copy:hover{background:#27485d}
pre{margin:0;padding:12px;overflow-x:auto;color:var(--code-ink);font:13px/1.55 var(--mono)}

/* picker */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.answer{border:1px dashed var(--line);border-radius:6px;padding:12px 14px;max-width:72ch}
.answer h4{margin:0 0 4px;font:700 18px var(--serif)}

.empty{padding:30px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.results-head{color:var(--muted);margin:0 0 12px}
.reset{background:transparent;border:0;color:var(--primary);text-decoration:underline;padding:0;font-size:14px}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:18px}
  nav.tabs{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .tab{min-width:210px;border-left-width:1px;border-top:4px solid var(--line);border-radius:0 0 6px 6px}
  .tab[aria-selected="true"]{border-top-color:var(--mark)}
  .body{padding-left:16px}
  .search{width:100%}
  main h2{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>FDE field guide</h1>
      <p id="overall">From a new laptop to a client handover.</p>
    </div>
    <div class="ctrl">
      <div class="seg" role="group" aria-label="Operating system">
        <button type="button" data-os="mac" aria-pressed="true">macOS / Linux</button>
        <button type="button" data-os="win" aria-pressed="false">Windows</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search the guide" aria-label="Search the guide">
    </div>
  </div>
  <div class="trail" id="trail" aria-hidden="true"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Guide tracks"></nav>
  <main id="main" aria-live="polite"></main>
</div>

<script>
/* ------------------------------------------------------------------
   TEAM VALUES: edit these before you hand the guide to new joiners.
------------------------------------------------------------------- */
const TEAM = {
  slack: '#fde-help',
  skillsRepo: 'https://github.com/YOUR-ORG/fde-claude-skills',
  templateRepo: 'https://github.com/YOUR-ORG/fde-project-template',
  handoverOwner: 'your.name@company.com',
  securityContact: 'security@your-company.com'
};
const R = String.raw;

/* ------------------------------------------------------------------
   CONTENT
   item = { id, t (title), d (description), pts[], code[], notes[], picker }
   code = { l (label), x (any OS) } or { l, mac, win }
   notes = { k:'tip'|'warn', x }
   In code, write @@{ where you need a literal ${  (template literals).
------------------------------------------------------------------- */
const TRACKS = [

/* ============================ 1. SETUP ============================ */
{
  id:'setup', title:'1. Set up your machine', short:'VS Code, Salesforce CLI, Claude Code',
  lead:'Work through this once, top to bottom. It takes about half a day, most of it waiting for installs. Finish with the smoke test so you know everything works before your first project.',
  meta:'Time: about 3 to 4 hours. Needs: admin rights on your laptop, a GitHub account, a Salesforce sandbox login.',
  sections:[
  { t:'Foundations', i:'Everything else sits on top of these four tools.', items:[
    { id:'s-core', t:'Install Git, Node.js, a JDK and the GitHub CLI',
      d:'Node runs the Salesforce CLI, LWC tests and Playwright. A JDK (17 or 21) is required by the Apex language server and Code Analyzer.',
      code:[{ l:'Install', mac:R`brew install git node@22 gh
brew install --cask temurin@21`, win:R`winget install Git.Git
winget install OpenJS.NodeJS.LTS
winget install GitHub.cli
winget install EclipseAdoptium.Temurin.21.JDK` },
        { l:'Verify', x:R`git --version
node --version
java -version
gh --version` }],
      notes:[{k:'tip',x:'On macOS without Homebrew, install it first from brew.sh. On Windows, open a new terminal after installing so the PATH refreshes.'}] },
    { id:'s-git', t:'Set up Git identity, SSH key and GitHub login',
      d:'Use your work email so commits are attributed correctly. Sign in to GitHub once with the CLI and let it upload the SSH key.',
      code:[{ l:'Configure', x:R`git config --global user.name "Your Name"
git config --global user.email "you@company.com"
git config --global init.defaultBranch main
git config --global pull.rebase true
ssh-keygen -t ed25519 -C "you@company.com"
gh auth login` }],
      notes:[{k:'warn',x:'Never commit auth files, .env files or org auth URLs. You will set up .gitignore rules in track 2, but build the habit now.'}] }
  ]},
  { t:'Editor', i:'One editor profile for everything: Apex, LWC, Playwright and Claude Code.', items:[
    { id:'s-vsc', t:'Install VS Code and the extensions',
      d:'Install VS Code from code.visualstudio.com, then enable the "code" shell command (Command Palette, "Shell Command: Install code command in PATH") and run this block.',
      code:[{ l:'Extensions', x:R`code --install-extension salesforce.salesforcedx-vscode
code --install-extension salesforce.sfdx-code-analyzer-vscode
code --install-extension anthropic.claude-code
code --install-extension ms-playwright.playwright
code --install-extension esbenp.prettier-vscode
code --install-extension dbaeumer.vscode-eslint
code --install-extension eamodio.gitlens
code --install-extension bierner.markdown-mermaid
code --install-extension redhat.vscode-yaml` }],
      pts:['Salesforce Extension Pack covers Apex, LWC, SOQL builder, org browser and Apex Replay Debugger.','Code Analyzer flags security and quality issues in Apex and LWC before a reviewer does.','Playwright extension lets you run and record UI tests from the editor.']},
    { id:'s-vsc-set', t:'Apply the recommended workspace settings',
      d:'Put these in your user settings (Command Palette, "Preferences: Open User Settings (JSON)").',
      code:[{ l:'settings.json', x:R`{
  "editor.formatOnSave": true,
  "editor.defaultFormatter": "esbenp.prettier-vscode",
  "files.insertFinalNewline": true,
  "files.trimTrailingWhitespace": true,
  "salesforcedx-vscode-core.show-cli-success-msg": false,
  "salesforcedx-vscode-apex.java.home": ""
}` }],
      notes:[{k:'tip',x:'If Apex features do not start, set salesforcedx-vscode-apex.java.home to your JDK folder (the value of JAVA_HOME).'}] }
  ]},
  { t:'Salesforce CLI', i:'The sf command is how you deploy, test and automate everything.', items:[
    { id:'s-sf', t:'Install the Salesforce CLI (sf)',
      d:'Install the current CLI. Do not install the old sfdx v7 package alongside it.',
      code:[{ l:'Install and verify', x:R`npm install --global @salesforce/cli
sf --version
sf update` }]},
    { id:'s-auth', t:'Log in to your first sandbox with a clear alias',
      d:'Use a client prefix plus the environment name. Never make production your default org.',
      code:[{ l:'Authorize', x:R`sf org login web --alias client-dev --instance-url https://test.salesforce.com --set-default
sf org list
sf org display --target-org client-dev` }],
      pts:['Aliases: client-dev, client-sit, client-uat, client-prod.','Sandboxes log in at test.salesforce.com. Production and Developer Edition use login.salesforce.com (the default).','Auth tokens expire. If you see an expired token error, just log in again.'],
      notes:[{k:'warn',x:'sf org display --verbose prints a secret auth URL. Do not paste its output into chat, tickets or Claude prompts.'}]},
    { id:'s-plugins', t:'Install Code Analyzer and check the agent commands',
      d:'Code Analyzer runs static analysis from the terminal and in CI. The agent commands are what you will use to test Agentforce agents in track 3.',
      code:[{ l:'Plugins', x:R`sf plugins install code-analyzer
sf code-analyzer run --workspace force-app --view table
sf agent --help
sf agent test --help` }],
      notes:[{k:'tip',x:'Agentforce CLI commands are evolving quickly. If sf agent test is missing, run sf update first, then check the release notes for the plugin.'}]},
    { id:'s-scratch', t:'Optional: create a scratch org',
      d:'Only if the project uses scratch orgs and you have access to a Dev Hub.',
      code:[{ l:'Scratch org', x:R`sf org login web --alias devhub --set-default-dev-hub
sf org create scratch --definition-file config/project-scratch-def.json --alias scratch1 --duration-days 7 --set-default` }]}
  ]},
  { t:'Claude Code', i:'Your AI pair engineer, inside the terminal and VS Code.', items:[
    { id:'s-cc', t:'Install Claude Code and sign in',
      d:'Use the account your company approved. The first run opens a browser to log in.',
      code:[{ l:'Install', mac:R`curl -fsSL https://claude.ai/install.sh | bash
claude --version
claude`, win:R`irm https://claude.ai/install.ps1 | iex
claude --version
claude` },
        { l:'Alternative via npm', x:R`npm install -g @anthropic-ai/claude-code` },
        { l:'Health check', x:R`claude doctor` }],
      notes:[{k:'warn',x:'Company policy: conversations are retained and may be reviewed by administrators. Do not paste real customer data, secrets or credentials. Use placeholders such as CUSTOMER_1.'}]},
    { id:'s-cc-vsc', t:'Connect Claude Code to VS Code',
      d:'Install the Claude Code extension (done above), then open the integrated terminal in your project and run claude. The extension also adds a side panel with diff views.',
      code:[{ l:'In a Claude Code session', x:R`/ide
/status` }],
      pts:['Selected lines and open files are shared with Claude automatically.','Edits appear as diffs in the editor, so you review before accepting.']},
    { id:'s-skills', t:'Add Salesforce skills to Claude Code',
      d:'Skills are folders with a SKILL.md that teach Claude how your team does specific jobs (Apex, LWC, Flow, deploys). They load only when relevant, so they cost very little context.',
      code:[{ l:'Option A: install from the team marketplace', x:'/plugin marketplace add ' + TEAM.skillsRepo.replace('https://github.com/','') + '\n/plugin install salesforce-skills@fde-claude-skills\n/plugin list' },
        { l:'Option B: copy skills by hand (personal, all projects)', mac:R`mkdir -p ~/.claude/skills
git clone ${TEAM.skillsRepo} /tmp/fde-skills
cp -R /tmp/fde-skills/skills/* ~/.claude/skills/
ls ~/.claude/skills`, win:R`mkdir $HOME\.claude\skills -Force
git clone ${TEAM.skillsRepo} $HOME\fde-skills
Copy-Item $HOME\fde-skills\skills\* $HOME\.claude\skills -Recurse -Force
dir $HOME\.claude\skills` }],
      pts:['Recommended starter set: Apex (bulkification, triggers, tests), LWC, Flow, SOQL and data, metadata deploy, Agentforce agent design, and testing.','Project-specific skills go in the repo at .claude/skills. Personal skills go in ~/.claude/skills.','Ask in a session "What skills do you have available?" to confirm they loaded.'],
      notes:[{k:'warn',x:'A skill can instruct Claude to run commands. Only install skills from your team repo or sources you have read. Open the SKILL.md before you trust it.'},
             {k:'tip',x:'The repo URL and marketplace name above are placeholders. Replace SKILLS_REPO with the URL set in TEAM at the top of this file, and ask your lead for the approved list.'}]},
    { id:'s-mcp', t:'Connect the Salesforce DX MCP server',
      d:'Lets Claude query orgs, read metadata and run tests through a structured tool instead of guessing shell commands.',
      code:[{ l:'Add for this machine', x:R`claude mcp add salesforce -- npx -y @salesforce/mcp --orgs DEFAULT_TARGET_ORG --toolsets orgs,metadata,data,users
claude mcp list` }],
      notes:[{k:'tip',x:'Limit it to sandboxes and only the toolsets you need. Check the Salesforce DX MCP docs for current flag names, as they can change between versions.'}]},
    { id:'s-user-md', t:'Write your personal CLAUDE.md',
      d:'~/.claude/CLAUDE.md applies to every project. Keep it short and about you, not the client.',
      code:[{ l:'~/.claude/CLAUDE.md', x:R`# About me
- Forward deployed engineer working mostly on Salesforce and Agentforce.
- Explain trade-offs briefly, then recommend one option.

# Working style
- Plan first for anything touching more than 3 files.
- Show me the diff before committing. Small commits with clear messages.
- Never run deploys to an org or push to GitHub without asking.
- Never include real customer data in files, commands or search queries.` }]}
  ]},
  { t:'Test tooling and extras', i:'Set these up now so they are ready on day one of a project.', items:[
    { id:'s-pw', t:'Install Playwright browsers',
      d:'Used for UI automation in track 3. Install the browser once per machine.',
      code:[{ l:'Install', x:R`npx playwright install --with-deps chromium
npx playwright --version` }]},
    { id:'s-extras', t:'Install the handy extras',
      pts:['Salesforce Inspector Reloaded (Chrome extension): inspect fields, run SOQL, export data.','Bruno or Postman: test REST callouts and Salesforce APIs.','jq: parse the JSON that sf and Playwright produce.','Draw.io or the Mermaid preview in VS Code: architecture diagrams.','Data Loader or sf data commands: bulk data work.'],
      code:[{ l:'jq', mac:'brew install jq', win:'winget install jqlang.jq' }]},
    { id:'s-smoke', t:'Run the smoke test',
      d:'If every line prints a version or status, you are ready. Fix anything that fails before moving on.',
      code:[{ l:'Smoke test', x:R`git --version && node --version && java -version
sf --version && sf org list
gh auth status
claude --version
npx playwright --version
code --list-extensions | grep -E "salesforce|claude|playwright"` }],
      notes:[{k:'tip',x:'Stuck? Post the error text (not screenshots of secrets) in ' + TEAM.slack + '.'}]}
  ]}
  ]
},

/* ========================= 2. ESSENTIALS ========================= */
{
  id:'essentials', title:'2. Start a project well', short:'Repo, CLAUDE.md, project skills',
  lead:'Do this in the first two days of an engagement, before feature work starts. A good starting setup means Claude, your teammates and your future self all understand the project the same way.',
  meta:'Time: about half a day per project. Output: a repo with CI, a CLAUDE.md, project skills and a decision log.',
  sections:[
  { t:'Repository foundation', i:'Create it once and make it hard to break.', items:[
    { id:'e-repo', t:'Create the project and the GitHub repo',
      d:'Start from the team template if one exists. Otherwise generate a standard DX project.',
      code:[{ l:'Scaffold', x:R`sf project generate --name acme-fde --template standard --manifest
cd acme-fde
git init -b main
gh repo create YOUR-ORG/acme-fde --private --source . --remote origin
git add . && git commit -m "chore: initial project scaffold"
git push -u origin main` }],
      notes:[{k:'tip',x:'Team template: ' + TEAM.templateRepo + ' (placeholder). Using it gives you the folders, CI, PR template and CLAUDE.md skeleton in one go.'}]},
    { id:'e-ignore', t:'Add a safe .gitignore',
      code:[{ l:'.gitignore', x:R`# Salesforce local state
.sf/
.sfdx/
.localdevserver/
.vscode/settings.json

# Secrets and sessions
.env
.env.*
auth*.txt
.auth/

# Node and test output
node_modules/
reports/
playwright-report/
test-results/

# Claude Code local-only settings
.claude/settings.local.json` }]},
    { id:'e-branch', t:'Agree the branching and pull request rules',
      pts:['Short-lived branches from main, named feature/TICKET-123-short-name.','Protect main: pull request required, one approval, CI must pass, no force pushes.','Small pull requests. If a PR needs a long explanation, split it.','Use a PR template that asks for: what changed, how it was tested, deploy notes, rollback.'],
      code:[{ l:'.github/pull_request_template.md', x:R`## What changed

## How it was tested
- [ ] Apex tests
- [ ] LWC Jest
- [ ] Agent tests
- [ ] Playwright

## Deploy notes
(manual steps, data changes, permission sets)

## Rollback plan` }]},
    { id:'e-ci', t:'Add a validation check to every pull request',
      d:'The pipeline authenticates to a sandbox, validates the deployment and runs local tests. The auth URL is stored as a GitHub secret, never in the repo.',
      code:[{ l:'Get the auth URL once (keep it private)', x:R`sf org display --target-org client-dev --verbose --json | jq -r .result.sfdxAuthUrl
gh secret set SFDX_AUTH_URL_DEV` },
        { l:'.github/workflows/validate.yml', x:R`name: validate
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --global @salesforce/cli
      - name: Authenticate
        run: |
          echo "@@{{ secrets.SFDX_AUTH_URL_DEV }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias ci-org
          rm auth.txt
      - name: Validate deployment
        run: sf project deploy validate --source-dir force-app --target-org ci-org --test-level RunLocalTests --wait 60` }],
      notes:[{k:'tip',x:'Prefer a dedicated integration user and JWT login for shared pipelines. The auth URL approach is fine for a first iteration.'}]}
  ]},
  { t:'Claude Code project setup', i:'Commit these files so the whole team gets the same Claude behaviour.', items:[
    { id:'e-claudemd', t:'Write the project CLAUDE.md',
      d:'Claude reads this at the start of every session. Keep it under about 100 lines: commands, structure, conventions and hard rules. Update it whenever you correct Claude twice about the same thing.',
      code:[{ l:'CLAUDE.md', x:R`# Project: ACME service transformation

## Context
- Goal: deflect 30% of order-status cases with an Agentforce agent.
- Clouds: Service Cloud, Experience Cloud, Data Cloud. Integration: order API via Named Credential.

## Orgs
- client-dev: sandbox, default target
- client-sit, client-uat: sandboxes, deploy only via pipeline
- client-prod: READ ONLY. Never deploy, never run DML.

## Layout
- force-app/main/default: metadata
- specs/agent: Agentforce test specs
- tests/e2e: Playwright tests
- docs: ADRs (docs/adr), HANDOVER.md

## Commands
- Validate: sf project deploy validate --source-dir force-app --target-org client-dev --test-level RunLocalTests
- Apex tests: sf apex run test --target-org client-dev --test-level RunLocalTests --code-coverage --result-format human --wait 30
- LWC tests: npm run test:unit
- Agent tests: sf agent test run --api-name Order_Agent_Regression --target-org client-dev --wait 15
- UI tests: npx playwright test

## Conventions

import { execSync } from 'node:child_process';

export default async function globalSetup(_config: FullConfig) {
  const org = process.env.SF_ORG ?? 'client-dev';
  const raw = execSync('sf org open --target-org ' + org + ' --url-only --json').toString();
  const url = JSON.parse(raw).result.url; // contains a session token: never log it

  const browser = await chromium.launch();
  const page = await browser.newPage();
  await page.goto(url);
  await page.waitForURL(/lightning\.force\.com/, { timeout: 60_000 });
  process.env.SF_BASE_URL = new URL(page.url()).origin;
  await page.context().storageState({ path: '.auth/state.json' });
  await browser.close();
}` }],

npx playwright show-trace path/to/trace.zip` }]},
    { id:'f-ctx', t:'Claude forgets decisions or repeats mistakes',

  { t:'Delivery and client habits', i:'Technical skill gets you in the room. These keep you there.', items:[
    { id:'x-status', t:'Weekly status update template',
      code:[{ l:'Status', x:R`Week of [date]

    { id:'x-demo', t:'Demo and expectation tips',
      pts:['Demo on realistic synthetic data, from a sandbox you have rehearsed in.','Show failures and guardrails for agents, not just the happy path.','Say what is out of scope early and in writing.','Estimate in ranges and name your assumptions. Re-estimate when an assumption breaks.'] },
    { id:'x-release', t:'Know the Salesforce release rhythm',
      d:'Salesforce ships three major releases a year (Spring, Summer, Winter). Sandboxes get previews first, so check release notes for features and retirements that affect your project.' }
  ]},
  { t:'Learning and reference', i:'Where to go deeper.', items:[
    { id:'x-learn', t:'Learning path',
      pts:['Trailhead: Apex, LWC, Flow, Agentforce and Data Cloud modules.','Certifications worth targeting: Platform Developer I and II, JavaScript Developer I, Agentforce Specialist.','Docs: developer.salesforce.com, the Claude Code docs, playwright.dev.','Release notes: read the sections for the clouds on your current project.'] },
    { id:'x-gloss', t:'Glossary',
      pts:['FDE: forward deployed engineer, embedded with the client to deliver working outcomes.','Sandbox: copy of production metadata for dev and test. Scratch org: short-lived, source-driven org.','DX: Salesforce developer experience, the source-based workflow with the sf CLI.','Topic and action: Agentforce building blocks. A topic is a job the agent can do, actions are what it can run.','Skill: a folder of instructions Claude loads when relevant.','CLAUDE.md: the file Claude reads at the start of every session.','ADR: architecture decision record.','MCP: Model Context Protocol, a standard for connecting Claude to tools like orgs and databases.'] },
    { id:'x-links', t:'Team links and owners',
      d:'Edit the TEAM block at the top of this HTML file to keep these current.',
      pts:['Help channel: ' + TEAM.slack,'Skills repo: ' + TEAM.skillsRepo,'Project template: ' + TEAM.templateRepo,'Guide owner: ' + TEAM.handoverOwner,'Security contact: ' + TEAM.securityContact] }

/* Integration picker data */
const PICKS = [
  { q:'Show external data inside Salesforce in real time', h:'Callout with a Named Credential', a:'Call the API from Apex or an External Service, authenticated by a Named Credential. Cache what you can. For data you never want to copy, consider External Objects or Data Cloud zero-copy.', w:'Watch callout limits and timeouts. Never callout from a trigger synchronously.' },
  { q:'Tell another system when Salesforce data changes', h:'Change Data Capture or Platform Events', a:'Use CDC for record changes with minimal build effort. Use custom Platform Events when you need a business-level message with a defined payload.', w:'Plan for replay, event volume allocations and consumer monitoring.' },
  { q:'Receive updates from another system', h:'Platform Events, Salesforce APIs or Apex REST', a:'Prefer the standard REST or Composite APIs through a connected app or external client app. Publish Platform Events when the sender should not wait. Use Apex REST only for custom logic.', w:'Authenticate with a dedicated integration user and least-privilege permission sets.' },
  { q:'Load or sync large volumes', h:'Bulk API 2.0 or middleware', a:'Use Bulk API 2.0 for large batch loads and extracts. Use an integration platform if you need transformation, retries and monitoring.', w:'Agree on a schedule and an external ID for upserts.' },
  { q:'Long-running or heavy processing', h:'Queueable or Batch Apex, with an event on completion', a:'Move the work out of the user transaction. Queueable for chained jobs, Batch Apex for large data sets. Publish a Platform Event when done so the UI or agent can react.', w:'Design for idempotency. Jobs can retry.' },
  { q:'Let an agent act on a back-end system', h:'Invocable Apex or Flow action with a Named Credential', a:'Expose a narrow action with typed inputs and outputs. Keep the logic in Apex or Flow, not in the prompt. Return structured errors the agent can explain.', w:'Enforce record access in the action, not just in agent instructions.' }
];

/* ------------------------------------------------------------------
   APP
------------------------------------------------------------------- */
const state = { track:'setup', os:'mac', q:'' };
const open = new Set();
const KEY = 'fde-field-guide-progress';
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { done = new Set(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) { /* storage blocked: progress lasts for this session */ } }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let copies = [];

function itemsOf(tr){ return tr.sections.flatMap(s => s.items); }
function counts(tr){ const it = itemsOf(tr); return { n: it.filter(i => done.has(i.id)).length, total: it.length }; }

function codeHtml(c){
  const mac = c.x === undefined;
  let txt = mac ? (state.os === 'mac' ? c.mac : c.win) : c.x;
  txt = txt.replace(/@@\{/g, '${');
  copies.push(txt);
  const tag = mac ? ' (' + (state.os === 'mac' ? 'macOS / Linux' : 'Windows') + ')' : '';
  return '<div class="code"><div class="ch"><span>' + esc(c.l + tag) + '</span><button type="button" class="copy" data-copy="' + (copies.length - 1) + '">Copy</button></div><pre><code>' + esc(txt) + '</code></pre></div>';
}

function pickerHtml(){
  return '<div class="chips" role="group" aria-label="What do you need to do?">' +
    PICKS.map((p, i) => '<button type="button" class="chip" aria-pressed="false" data-pick="' + i + '">' + esc(p.q) + '</button>').join('') +
    '</div><div class="answer" id="answer">Choose a need above to see a suggested pattern.</div>';
}

function itemHtml(it){
  const isDone = done.has(it.id);
  let b = '';
  if (it.d) b += '<p>' + esc(it.d) + '</p>';
  if (it.picker) b += pickerHtml();
  (it.notes || []).forEach(n => { b += '<div class="note ' + (n.k === 'warn' ? 'warn' : '') + '"><b>' + (n.k === 'warn' ? 'Careful: ' : 'Tip: ') + '</b>' + esc(n.x) + '</div>'; });
  if (it.pts) b += '<ul class="pts">' + it.pts.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>';
  (it.code || []).forEach(c => { b += codeHtml(c); });
  return '<details class="item' + (isDone ? ' done' : '') + '" id="' + it.id + '" data-id="' + it.id + '"' + (open.has(it.id) ? ' open' : '') + '>' +
    '<summary><input type="checkbox" data-done="' + it.id + '" aria-label="Mark done: ' + esc(it.t) + '"' + (isDone ? ' checked' : '') + '><span class="t">' + esc(it.t) + '</span></summary>' +
    '<div class="body">' + b + '</div></details>';
}

function renderTabs(){
  $('#tabs').innerHTML = TRACKS.map(tr => {
    const c = counts(tr), pct = Math.round(100 * c.n / c.total);
    return '<button type="button" role="tab" class="tab" data-track="' + tr.id + '" aria-selected="' + (state.track === tr.id && !state.q) + '">' +
      '<strong>' + esc(tr.title) + '</strong><span>' + esc(tr.short) + '</span>' +
      '<span>' + c.n + ' of ' + c.total + ' done</span><div class="bar"><b style="width:' + pct + '%"></b></div></button>';
  }).join('');
  const segs = document.querySelectorAll('#trail i b');
  let all = 0, total = 0;
  TRACKS.forEach((tr, i) => { const c = counts(tr); all += c.n; total += c.total; segs[i].style.width = (100 * c.n / c.total) + '%'; });
  $('#overall').textContent = all === total ? 'Everything done. Welcome to the team.' : all + ' of ' + total + ' steps done. From a new laptop to a client handover.';
}

function renderMain(){
  copies = [];
  const q = state.q.trim().toLowerCase();
  let h = '';
  if (q){
    const hits = [];
    TRACKS.forEach(tr => tr.sections.forEach(s => s.items.forEach(it => {
      const hay = [it.t, it.d || '', (it.pts || []).join(' '), (it.code || []).map(c => (c.x || '') + (c.mac || '') + (c.win || '')).join(' ')].join(' ').toLowerCase();
      if (hay.includes(q)) hits.push({ it, tr });
    })));
    h += '<h2>Search</h2><p class="results-head">' + hits.length + ' result' + (hits.length === 1 ? '' : 's') + ' for "' + esc(state.q) + '". <button type="button" class="reset" id="clear">Clear search</button></p>';
    if (!hits.length) h += '<div class="empty">Nothing matched. Try a shorter word, like "agent", "deploy" or "token".</div>';
    else h += '<div class="items">' + hits.map(x => itemHtml(x.it).replace('<span class="t">' + esc(x.it.t) + '</span>', '<span class="t">' + esc(x.it.t) + '<span class="tag">' + esc(x.tr.title.replace(/^\d+\.\s*/, '')) + '</span></span>')).join('') + '</div>';
  } else {
    const tr = TRACKS.find(t => t.id === state.track);
    h += '<h2>' + esc(tr.title.replace(/^\d+\.\s*/, '')) + '</h2><p class="lead">' + esc(tr.lead) + '</p><p class="meta">' + esc(tr.meta) + '</p>';
    tr.sections.forEach(s => {
      h += '<h3>' + esc(s.t) + '</h3><p class="sec-intro">' + esc(s.i) + '</p><div class="items">' + s.items.map(itemHtml).join('') + '</div>';
    });
  }
  $('#main').innerHTML = h;
}

function render(){ renderTabs(); renderMain(); }

/* events */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-track]'); if (!b) return;
  state.track = b.dataset.track; state.q = ''; $('#q').value = '';
  render(); window.scrollTo({ top: 0 });
});
document.querySelectorAll('[data-os]').forEach(b => b.addEventListener('click', () => {
  state.os = b.dataset.os;
  document.querySelectorAll('[data-os]').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderMain();
}));
$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });

$('#main').addEventListener('click', e => {
  const cb = e.target.closest('[data-done]');
  if (cb){ e.stopPropagation(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp){
    const txt = copies[+cp.dataset.copy];
    const ok = () => { cp.textContent = 'Copied'; setTimeout(() => cp.textContent = 'Copy', 1500); };
    const fallback = () => { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (x) { cp.textContent = 'Press Ctrl+C'; } t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
    return;
  }
  const pk = e.target.closest('[data-pick]');
  if (pk){
    const p = PICKS[+pk.dataset.pick];
    pk.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === pk));
    pk.closest('.body').querySelector('.answer').innerHTML = '<h4>' + esc(p.h) + '</h4><p>' + esc(p.a) + '</p><p><b>Watch for:</b> ' + esc(p.w) + '</p>';
    return;
  }
  if (e.target.id === 'clear'){ state.q = ''; $('#q').value = ''; render(); }
});
$('#main').addEventListener('change', e => {
  const cb = e.target.closest('[data-done]'); if (!cb) return;
  const id = cb.dataset.done;
  cb.checked ? done.add(id) : done.delete(id);
  cb.closest('.item').classList.toggle('done', cb.checked);
  save(); renderTabs();
});
$('#main').addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset || !d.dataset.id) return;
  d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id);
}, true);

render();
</script>
</body>
</html>
